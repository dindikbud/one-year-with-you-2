<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09070d">
<title>Our Videos — One Year</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#09070d;color:#fff7fa;font-family:Georgia,serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 12% 10%,#6c2e56 0,transparent 32%),radial-gradient(circle at 90% 60%,#342153 0,transparent 34%),linear-gradient(#09070d,#130b16)}
.nav{position:fixed;z-index:20;top:18px;left:50%;transform:translateX(-50%);width:min(930px,calc(100% - 28px));display:flex;justify-content:space-between;align-items:center;padding:11px 14px 11px 20px;border:1px solid #fff2;border-radius:999px;background:#0e0910cc;box-shadow:0 15px 45px #0008}
.brand{font:600 18px Arial;color:#ff9fbe;line-height:1}
.links{display:flex;gap:7px}
.links a{font:12px Arial;color:#e9dce3;padding:10px 13px;border-radius:999px}
.links a:hover{background:#fff1f612}
.hero{min-height:55vh;display:grid;place-items:center;text-align:center;padding:130px 20px 40px}
.hero h1{font-size:clamp(52px,9vw,108px);font-weight:400;font-style:italic;margin:20px 0 12px}
.eyebrow{font:10px Arial;letter-spacing:.34em;text-transform:uppercase;color:#ff9fbe}
.hero p{font:14px/1.8 Arial;color:#c9b9c1;max-width:650px;margin:auto}
.container{width:min(1120px,calc(100% - 28px));margin:auto}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}
.count{font:12px Arial;color:#ad9aa4}
.back{padding:12px 17px;border:1px solid #fff2;border-radius:999px;color:#fff;font:600 12px Arial;background:#fff1f609;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding-bottom:100px}
.video-card{position:relative;overflow:hidden;border:1px solid #fff2;border-radius:27px;background:#ffffff08;box-shadow:0 25px 70px #0005;transition:transform .35s ease,border-color .35s ease;will-change:transform}
.video-card:hover{transform:translateY(-7px);border-color:#fff4}
.thumb{position:relative;aspect-ratio:16/9;background:#120d15;overflow:hidden;cursor:pointer}
.thumb video{width:100%;height:100%;display:block;object-fit:cover;opacity:.9}
.thumb .fallback{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;background:#1a0f1c;color:#ffadc5;font:12px/1.6 Arial}
.thumb.error .fallback{display:grid}
.thumb.error video,.thumb.error .play{display:none}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border:1px solid #fff6;border-radius:50%;background:#0d0910b5;color:white;font-size:22px;cursor:pointer}
.play:hover{background:#ff78a955}
.info{padding:20px 21px 22px}
.info h2{font-size:24px;font-weight:400;margin:0 0 8px}
.meta{font:11px Arial;color:#ad9aa4;letter-spacing:.08em}
.actions{display:flex;gap:8px;margin-top:17px;flex-wrap:wrap}
.action{padding:10px 13px;border-radius:999px;border:1px solid #fff2;background:#fff1f608;color:#fff;font:600 11px Arial;cursor:pointer;text-decoration:none}
.action:hover{background:#ff78a920}
.empty{text-align:center;padding:70px 25px;border:1px dashed #fff3;border-radius:28px;color:#bcaab3;font:14px/1.8 Arial}
.empty code{color:#ffadc5}
.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:#050307e8;padding:20px}
.modal.open{display:grid}
.modal-box{width:min(1050px,100%);border:1px solid #fff2;border-radius:25px;overflow:hidden;background:#0d0910;box-shadow:0 40px 120px #000}
.modal video{display:block;width:100%;max-height:76vh;background:#000}
.modal-error{display:none;padding:26px 22px;color:#ffd5e0;font:13px/1.7 Arial;text-align:center}
.modal-error.show{display:block}
.modal-error strong{color:#ff9fbe}
.modal-error code{background:#00000055;padding:3px 7px;border-radius:6px;color:#ffadc5;font-size:12px;word-break:break-all}
.modal-error a{color:#fff;text-decoration:underline;display:inline-block;margin-top:12px;padding:10px 16px;border:1px solid #fff3;border-radius:999px;text-decoration:none;background:#ffffff10}
.modal-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 17px}
.modal-title{font:14px Arial}
.close{border:0;background:#fff1f611;color:#fff;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:18px}
.footer{text-align:center;padding:30px 20px 70px;color:#8f7c87;font:10px Arial;letter-spacing:.15em}
.petal{position:fixed;top:-25px;z-index:5;width:11px;height:17px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#ffdce7,#d86c9c);pointer-events:none;opacity:.6;animation:fall linear infinite;will-change:transform}
@keyframes fall{
  0%{transform:translate3d(0,-10vh,0) rotate(0)}
  100%{transform:translate3d(var(--x),110vh,0) rotate(720deg)}
}
@media(max-width:750px){.grid{grid-template-columns:1fr}.links a:nth-child(2){display:none}.nav{top:9px}}
</style>
</head>
<body>
<nav class="nav">
 <a class="brand" href="anniversary_garden_v2.html" aria-label="Home">♥</a>
 <div class="links">
   <a href="anniversary_garden_v2.html">Our Story</a>
   <a href="ourvideo.html">Our Videos</a>
   <a href="anniversary_garden_v2.html#letter">Letter</a>
 </div>
</nav>

<header class="hero">
 <div>
  <div class="eyebrow">Our memories • chapter two</div>
  <h1>Moments We Keep</h1>
  <p>Every video is a little piece of our journey.</p>
 </div>
</header>

<main class="container">
 <div class="toolbar">
   <div class="count" id="count">0 memories</div>
   <a class="back" href="anniversary_garden_v2.html">← Back to Our Story</a>
 </div>
 <section class="grid" id="grid"></section>
</main>

<footer class="footer">OUR STORY · OUR MEMORIES · OUR NEXT CHAPTER</footer>

<div class="modal" id="modal" aria-hidden="true">
 <div class="modal-box">
  <video id="player" controls playsinline preload="metadata"></video>
  <div class="modal-error" id="modalError"></div>
  <div class="modal-bar">
    <div class="modal-title" id="modalTitle">Our memory</div>
    <button class="close" id="close" aria-label="Close">×</button>
  </div>
 </div>
</div>

<script>
/* ============================================================
   EDIT DI SINI — daftar nama file video (di folder "videos/")
   PERHATIAN: huruf besar/kecil HARUS sama persis dengan file
   di GitHub (contoh: video2.mp4 ≠ Video2.mp4)
   ============================================================ */
const videoNames = [
  'video2.mp4',
];
const VIDEO_DIR = 'videos/';  // pastikan folder "videos" ada di root repo

/* ---------- helpers ---------- */
function getMime(name){
  const ext = name.split('.').pop().toLowerCase();
  return ({ mp4:'video/mp4', m4v:'video/mp4', webm:'video/webm',
           ogg:'video/ogg', ogv:'video/ogg' })[ext] || 'video/mp4';
}
function prettyName(name){
  return name.replace(/\.[^.]+$/,'')
             .replace(/[-_]+/g,' ')
             .replace(/\b\w/g,c=>c.toUpperCase());
}
function formatBytes(b){
  if(!b || b<0) return '';
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  if(b<1073741824) return (b/1048576).toFixed(1)+' MB';
  return (b/1073741824).toFixed(1)+' GB';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- build data ---------- */
const videos = videoNames.map(file => {
  const ext = file.split('.').pop().toLowerCase();
  return {
    name: prettyName(file),
    file,
    url : VIDEO_DIR + file,
    ext,
    mime: getMime(file)
  };
});

/* ---------- render ---------- */
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');

if(!videos.length){
  countEl.textContent = '0 memories';
  grid.outerHTML = `<div class="empty">
    <strong>No videos yet.</strong><br>
    Buka file ini, lalu edit variabel <code>videoNames</code> di dalam &lt;script&gt;.<br>
    Letakkan file video (MP4 / WebM / OGG / M4V) di folder <code>videos/</code>.
  </div>`;
} else {
  countEl.textContent = videos.length + (videos.length === 1 ? ' memory' : ' memories');
  grid.innerHTML = videos.map((v,i)=>`
    <article class="video-card">
      <div class="thumb" data-thumb="${i}">
        <video preload="metadata" muted playsinline>
          <source src="${esc(v.url)}" type="${v.mime}">
        </video>
        <div class="fallback">
          ⚠ Video tidak ditemukan:<br>
          <code style="background:#00000055;padding:3px 7px;border-radius:6px;color:#ffadc5;font-size:11px;word-break:break-all;display:inline-block;margin-top:6px">${esc(v.url)}</code>
        </div>
        <button class="play" data-video="${i}" aria-label="Play video">▶</button>
      </div>
      <div class="info">
        <h2>${esc(v.name)}</h2>
        <div class="meta"><span data-size="${i}">${v.ext.toUpperCase()}</span></div>
        <div class="actions">
          <button class="action" data-video="${i}">▶ Watch memory</button>
          <a class="action" href="${esc(v.url)}" target="_blank" rel="noopener">↗ Open direct</a>
          <a class="action" href="${esc(v.url)}" download>⤓ Save</a>
        </div>
      </div>
    </article>
  `).join('');
}

/* ---------- deteksi error thumbnail ---------- */
document.querySelectorAll('.thumb video').forEach(vid=>{
  vid.addEventListener('error', ()=>{
    vid.closest('.thumb').classList.add('error');
  });
  // cek lagi setelah source error
  vid.querySelectorAll('source').forEach(s=>{
    s.addEventListener('error', ()=> vid.closest('.thumb').classList.add('error'));
  });
});

/* ---------- ambil ukuran file (opsional) ---------- */
videos.forEach((v,i)=>{
  fetch(v.url, {method:'HEAD'})
    .then(r => {
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const len = r.headers.get('content-length');
      if(len){
        const el = document.querySelector(`[data-size="${i}"]`);
        if(el) el.textContent = v.ext.toUpperCase() + ' · ' + formatBytes(parseInt(len,10));
      }
    })
    .catch(()=>{
      const el = document.querySelector(`[data-size="${i}"]`);
      if(el) el.textContent = v.ext.toUpperCase() + ' · ⚠ file tidak ditemukan';
    });
});

/* ---------- modal play ---------- */
const modal   = document.getElementById('modal');
const player  = document.getElementById('player');
const title   = document.getElementById('modalTitle');
const errBox  = document.getElementById('modalError');

function showModalError(i){
  const v = videos[i];
  const abs = new URL(v.url, location.href).href;
  errBox.innerHTML = `
    <strong>⚠ Video tidak bisa diputar</strong><br><br>
    Cek hal berikut di repo GitHub kamu:<br>
    1. File <code>${esc(v.file)}</code> benar-benar ada di folder <code>videos/</code><br>
    2. Huruf besar/kecil nama file <b>sama persis</b> (GitHub case-sensitive)<br>
    3. Ukuran file <b>tidak lebih dari 100 MB</b> (batas GitHub)<br>
    4. Path lengkap: <code>${esc(v.url)}</code><br><br>
    <a href="${esc(v.url)}" target="_blank" rel="noopener">↗ Coba buka langsung di tab baru</a>
  `;
  errBox.classList.add('show');
  player.style.display = 'none';
}
function hideModalError(){
  errBox.classList.remove('show');
  errBox.innerHTML = '';
  player.style.display = '';
}

function openVideo(i){
  const v = videos[i]; if(!v) return;
  hideModalError();
  player.pause();
  player.src = v.url;
  player.load();
  title.textContent = v.name;
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
  const p = player.play();
  if(p && p.catch) p.catch(()=>{});
}
function closeVideo(){
  player.pause();
  player.removeAttribute('src');
  player.load();
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden','true');
  hideModalError();
}

/* error saat load di modal */
player.addEventListener('error', ()=>{
  showModalError(videos.findIndex(x=>x.url === player.getAttribute('src') || x.url === player.currentSrc) || 0);
});

/* klik tombol */
document.querySelectorAll('[data-video]').forEach(b=>{
  b.addEventListener('click', e=>{
    e.stopPropagation();
    openVideo(Number(b.dataset.video));
  });
});
/* klik area thumb */
document.querySelectorAll('[data-thumb]').forEach(t=>{
  t.addEventListener('click', e=>{
    if(e.target.closest('[data-video]')) return;
    openVideo(Number(t.dataset.thumb));
  });
});

document.getElementById('close').onclick = closeVideo;
modal.addEventListener('click', e=>{ if(e.target === modal) closeVideo(); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeVideo(); });

/* ---------- petals pool ---------- */
(function petals(){
  const N = 14;
  for(let i=0;i<N;i++){
    const p = document.createElement('i');
    p.className = 'petal';
    p.style.left = (Math.random()*100) + 'vw';
    p.style.setProperty('--x', (Math.random()*220-110) + 'px');
    p.style.animationDuration = (7 + Math.random()*8) + 's';
    p.style.animationDelay    = (-Math.random()*12) + 's';
    p.style.width  = (8 + Math.random()*6) + 'px';
    p.style.height = (12 + Math.random()*8) + 'px';
    document.body.appendChild(p);
  }
})();
</script>
</body>
</html>
